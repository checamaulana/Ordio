<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Tempo - Konfirmasi Pesanan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            200: '#eaddd7',
                            300: '#e0cec7',
                            400: '#d2bab0',
                            500: '#a37c68', // Brand primary (Amber/Brown)
                            600: '#8c6551',
                            700: '#755140',
                            800: '#5c3d2e',
                            900: '#472d20',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div class="max-w-md mx-auto min-h-screen bg-slate-50 relative pb-32 flex flex-col">
        
        <!-- Header -->
        <header class="bg-white px-4 py-4 flex items-center gap-3 border-b border-slate-200 sticky top-0 z-40">
            <a href="index.html" class="w-10 h-10 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <div>
                <h1 class="font-bold text-slate-800">Konfirmasi Pesanan</h1>
                <p class="text-xs text-slate-500">Meja 12</p>
            </div>
        </header>

        <main class="flex-1 p-4 space-y-6">
            
            <!-- Order Items -->
            <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-sm font-bold text-slate-800 mb-4 pb-3 border-b border-slate-100">Pesanan Anda</h2>
                
                <div class="space-y-4">
                    <!-- Item 1 -->
                    <div class="flex gap-3 items-start">
                        <img src="https://images.unsplash.com/photo-1579992357154-faf4bde95b3d?auto=format&fit=crop&w=150&q=80" alt="Matcha Latte" class="w-16 h-16 object-cover rounded-lg border border-slate-100">
                        <div class="flex-1">
                            <div class="flex justify-between items-start">
                                <h3 class="font-semibold text-slate-900 leading-tight">Matcha Latte</h3>
                                <span class="font-semibold text-slate-900">Rp 25.200</span>
                            </div>
                            <!-- Variation -->
                            <p class="text-xs text-slate-500 mt-1">Reguler, Less Sugar</p>
                            
                            <div class="flex justify-between items-center mt-2">
                                <div class="flex items-center gap-3 bg-slate-50 border border-slate-200 rounded-full px-2 py-1">
                                    <button class="w-5 h-5 rounded-full text-slate-500 flex items-center justify-center cursor-pointer hover:bg-slate-200 transition-colors">
                                        <i data-lucide="minus" class="w-3 h-3"></i>
                                    </button>
                                    <span class="text-xs font-semibold w-2 text-center">1</span>
                                    <button class="w-5 h-5 rounded-full text-slate-500 flex items-center justify-center cursor-pointer hover:bg-slate-200 transition-colors">
                                        <i data-lucide="plus" class="w-3 h-3"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Note input -->
                    <div class="relative">
                        <i data-lucide="edit-3" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                        <input type="text" placeholder="Catatan (opsional)..." class="w-full text-sm bg-slate-50 border border-slate-200 rounded-lg pl-9 pr-3 py-2 text-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                    </div>
                </div>
                
                <!-- Add More Button -->
                <a href="index.html" class="mt-5 w-full block text-center py-2.5 rounded-xl border border-dashed border-primary-300 text-primary-700 font-medium text-sm hover:bg-primary-50 transition-colors cursor-pointer">
                    + Tambah Pesanan Lain
                </a>
            </section>

            <!-- Order Summary -->
            <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
                <div class="flex justify-between items-center text-sm text-slate-500">
                    <span>Subtotal</span>
                    <span>Rp 25.200</span>
                </div>
                <div class="flex justify-between items-center text-sm text-slate-500">
                    <span>Pajak (11%)</span>
                    <span>Rp 2.772</span>
                </div>
                <div class="pt-3 border-t border-slate-100 flex justify-between items-center">
                    <span class="font-bold text-slate-800">Total Pembayaran</span>
                    <span class="font-bold text-lg text-primary-800">Rp 27.972</span>
                </div>
            </section>
            
            <!-- Payment Method Form (Not a real form to make prototype work with links) -->
            <section class="space-y-3">
                <h2 class="text-sm font-bold text-slate-800 px-1">Metode Pembayaran</h2>
                
                <div class="space-y-2">
                    <!-- Option 1: QRIS -->
                    <label class="flex items-center justify-between p-4 bg-white border border-slate-200 rounded-xl cursor-pointer hover:border-primary-400 transition-colors has-[:checked]:border-primary-600 has-[:checked]:bg-primary-50 ring-transparent has-[:checked]:ring-1 has-[:checked]:ring-primary-600 relative overflow-hidden group">
                        <div class="flex items-center gap-3">
                            <input type="radio" name="payment" value="qris" class="w-5 h-5 text-primary-600 focus:ring-primary-500 cursor-pointer" id="pay-qris" checked>
                            <span class="font-medium text-slate-800">QRIS</span>
                        </div>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a2/Logo_QRIS.svg" alt="QRIS" class="h-5">
                    </label>

                    <!-- Option 2: Cash -->
                    <label class="flex items-center justify-between p-4 bg-white border border-slate-200 rounded-xl cursor-pointer hover:border-primary-400 transition-colors has-[:checked]:border-primary-600 has-[:checked]:bg-primary-50 ring-transparent has-[:checked]:ring-1 has-[:checked]:ring-primary-600 relative overflow-hidden group">
                        <div class="flex items-center gap-3">
                            <input type="radio" name="payment" value="cash" class="w-5 h-5 text-primary-600 focus:ring-primary-500 cursor-pointer" id="pay-cash">
                            <div class="flex flex-col">
                                <span class="font-medium text-slate-800">Tunai / Cash</span>
                                <span class="text-xs text-slate-500">Bayar di Kasir</span>
                            </div>
                        </div>
                        <i data-lucide="banknote" class="w-6 h-6 text-slate-400"></i>
                    </label>
                </div>
            </section>

        </main>

        <!-- Floating Checkout Button -->
        <div class="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-200 z-50">
            <div class="max-w-md mx-auto">
                <button id="btnPesan" class="w-full bg-primary-800 text-white rounded-xl py-3.5 px-4 font-bold text-sm shadow-md hover:bg-primary-900 transition-all cursor-pointer flex justify-center items-center gap-2 active:scale-[0.98]">
                    Pesan & Proses Pembayaran <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

    </div>

    <!-- Prototype interaction script -->
    <script>
        lucide.createIcons();
        
        document.getElementById('btnPesan').addEventListener('click', function() {
            const isQris = document.getElementById('pay-qris').checked;
            if (isQris) {
                window.location.href = 'qris-payment.html';
            } else {
                window.location.href = 'cash-payment.html';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Menu - Kopi Tempo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            200: '#eaddd7',
                            300: '#e0cec7',
                            400: '#d2bab0',
                            500: '#a37c68', // Brand primary
                            600: '#8c6551',
                            700: '#755140',
                            800: '#5c3d2e',
                            900: '#472d20',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col h-screen sticky top-0 shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-slate-800 shrink-0 bg-slate-950">
            <h1 class="text-white font-bold text-lg flex items-center gap-2">
                <i data-lucide="coffee" class="text-primary-400 w-5 h-5"></i> Kopi Tempo
            </h1>
        </div>
        
        <div class="flex-1 py-6 px-4 space-y-1 overflow-y-auto">
            <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Pesanan Aktif
            </a>
            <a href="menu.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary-600/10 text-primary-400 border border-primary-500/20 font-medium transition-colors">
                <i data-lucide="book-open" class="w-5 h-5"></i> Menu & Kategori
            </a>
            <a href="tables.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i data-lucide="layout-grid" class="w-5 h-5"></i> Meja & QR
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i> Laporan
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0">
        
        <!-- Header -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 shrink-0 z-10 sticky top-0">
            <h2 class="font-bold text-slate-800 text-lg">Manajemen Menu</h2>
            
            <button class="bg-primary-800 hover:bg-primary-900 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 shadow-sm transition-all cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i> Tambah Item
            </button>
        </header>

        <!-- Content Body -->
        <div class="flex-1 p-6 overflow-y-auto w-full max-w-6xl mx-auto space-y-6">
            
            <!-- Filter & Search -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="relative flex-1">
                    <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                    <input type="text" placeholder="Cari nama menu..." class="w-full pl-9 pr-3 py-2 border border-slate-200 rounded-lg text-sm bg-slate-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 transition-colors">
                </div>
                <select class="border border-slate-200 rounded-lg text-sm py-2 px-3 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-primary-500/20 cursor-pointer text-slate-700">
                    <option value="">Semua Kategori</option>
                    <option value="kopi">Kopi</option>
                    <option value="non-kopi">Non Kopi</option>
                    <option value="camilan">Camilan</option>
                </select>
                <button class="text-slate-500 hover:text-primary-600 px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 hover:bg-white transition-colors cursor-pointer text-sm font-medium">
                    Atur Kategori
                </button>
            </div>

            <!-- Table -->
            <div class="bg-white border text-left border-slate-200 rounded-xl shadow-sm overflow-hidden">
                <table class="w-full text-sm">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="py-3 px-4 text-slate-500 font-medium w-16 text-center">No</th>
                            <th class="py-3 px-4 text-slate-500 font-medium">Item Menu</th>
                            <th class="py-3 px-4 text-slate-500 font-medium w-32">Harga</th>
                            <th class="py-3 px-4 text-slate-500 font-medium w-32 text-center">Kategori</th>
                            <th class="py-3 px-4 text-slate-500 font-medium w-32 text-center">Status</th>
                            <th class="py-3 px-4 text-slate-500 font-medium w-24 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        
                        <!-- Row 1 -->
                        <tr class="hover:bg-slate-50 transition-colors group">
                            <td class="py-3 px-4 text-center text-slate-500 text-xs">1</td>
                            <td class="py-3 px-4">
                                <div class="flex items-center gap-3">
                                    <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=100&q=80" alt="Kopi Susu" class="w-10 h-10 rounded-lg object-cover">
                                    <div>
                                        <p class="font-medium text-slate-900">Kopi Susu Tempo</p>
                                        <div class="flex items-center gap-2 mt-0.5">
                                            <span class="text-[10px] bg-amber-100 text-amber-700 px-1.5 rounded uppercase font-bold tracking-wider">Terlaris</span>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td class="py-3 px-4 font-medium text-slate-700">Rp 22.000</td>
                            <td class="py-3 px-4 text-center">
                                <span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-full border border-slate-200">Kopi</span>
                            </td>
                            <td class="py-3 px-4 text-center">
                                <label class="relative inline-flex items-center cursor-pointer">
                                  <input type="checkbox" value="" class="sr-only peer" checked>
                                  <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary-600"></div>
                                  <span class="ml-2 text-xs font-medium text-slate-600">Tersedia</span>
                                </label>
                            </td>
                            <td class="py-3 px-4 text-center text-slate-400">
                                <div class="flex justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button class="hover:text-amber-500 transition-colors cursor-pointer"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                    <button class="hover:text-rose-500 transition-colors cursor-pointer"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </td>
                        </tr>

                        <!-- Row 2 -->
                        <tr class="hover:bg-slate-50 transition-colors group">
                            <td class="py-3 px-4 text-center text-slate-500 text-xs">2</td>
                            <td class="py-3 px-4">
                                <div class="flex items-center gap-3">
                                    <img src="https://images.unsplash.com/photo-1579992357154-faf4bde95b3d?auto=format&fit=crop&w=100&q=80" alt="Matcha" class="w-10 h-10 rounded-lg object-cover">
                                    <div>
                                        <p class="font-medium text-slate-900">Matcha Latte</p>
                                        <div class="flex items-center gap-2 mt-0.5">
                                            <span class="text-[10px] bg-sky-100 text-sky-700 px-1.5 rounded uppercase font-bold tracking-wider">Diskon 10%</span>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td class="py-3 px-4">
                                <div class="flex flex-col">
                                    <span class="font-medium text-slate-700">Rp 25.200</span>
                                    <span class="text-xs text-slate-400 line-through">Rp 28.000</span>
                                </div>
                            </td>
                            <td class="py-3 px-4 text-center">
                                <span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-full border border-slate-200">Non Kopi</span>
                            </td>
                            <td class="py-3 px-4 text-center">
                                <label class="relative inline-flex items-center cursor-pointer">
                                  <input type="checkbox" value="" class="sr-only peer" checked>
                                  <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary-600"></div>
                                  <span class="ml-2 text-xs font-medium text-slate-600">Tersedia</span>
                                </label>
                            </td>
                            <td class="py-3 px-4 text-center text-slate-400">
                                <div class="flex justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button class="hover:text-amber-500 transition-colors cursor-pointer"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                    <button class="hover:text-rose-500 transition-colors cursor-pointer"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </td>
                        </tr>

                        <!-- Row 3 Out of stock -->
                        <tr class="hover:bg-slate-50 transition-colors group bg-slate-50/50">
                            <td class="py-3 px-4 text-center text-slate-500 text-xs">3</td>
                            <td class="py-3 px-4">
                                <div class="flex items-center gap-3 opacity-60">
                                    <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=100&q=80" alt="Croissant" class="w-10 h-10 rounded-lg object-cover grayscale">
                                    <div>
                                        <p class="font-medium text-slate-700">Butter Croissant</p>
                                    </div>
                                </div>
                            </td>
                            <td class="py-3 px-4 font-medium text-slate-500 opacity-60">Rp 18.000</td>
                            <td class="py-3 px-4 text-center opacity-60">
                                <span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-full border border-slate-200">Camilan</span>
                            </td>
                            <td class="py-3 px-4 text-center">
                                <label class="relative inline-flex items-center cursor-pointer">
                                  <input type="checkbox" value="" class="sr-only peer">
                                  <div class="w-9 h-5 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-primary-600"></div>
                                  <span class="ml-2 text-xs font-medium text-slate-400">Habis</span>
                                </label>
                            </td>
                            <td class="py-3 px-4 text-center text-slate-400">
                                <div class="flex justify-center gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button class="hover:text-amber-500 transition-colors cursor-pointer"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                    <button class="hover:text-rose-500 transition-colors cursor-pointer"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>

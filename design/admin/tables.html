<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Meja - Kopi Tempo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            200: '#eaddd7',
                            300: '#e0cec7',
                            400: '#d2bab0',
                            500: '#a37c68', // Brand primary
                            600: '#8c6551',
                            700: '#755140',
                            800: '#5c3d2e',
                            900: '#472d20',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col h-screen sticky top-0 shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-slate-800 shrink-0 bg-slate-950">
            <h1 class="text-white font-bold text-lg flex items-center gap-2">
                <i data-lucide="coffee" class="text-primary-400 w-5 h-5"></i> Kopi Tempo
            </h1>
        </div>
        
        <div class="flex-1 py-6 px-4 space-y-1 overflow-y-auto">
            <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Pesanan Aktif
            </a>
            <a href="menu.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i data-lucide="book-open" class="w-5 h-5"></i> Menu & Kategori
            </a>
            <a href="tables.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-primary-600/10 text-primary-400 border border-primary-500/20 font-medium transition-colors">
                <i data-lucide="layout-grid" class="w-5 h-5"></i> Meja & QR
            </a>
            <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition-colors">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i> Laporan
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col min-w-0">
        
        <!-- Header -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 shrink-0 z-10 sticky top-0">
            <h2 class="font-bold text-slate-800 text-lg">Manajemen Meja & QR Code</h2>
            
            <button class="bg-primary-800 hover:bg-primary-900 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 shadow-sm transition-all cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i> Tambah Meja
            </button>
        </header>

        <!-- Content Body -->
        <div class="flex-1 p-6 overflow-y-auto w-full max-w-6xl mx-auto space-y-6">
            
            <!-- Cards Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                
                <!-- Table 1 (Occupied/Active) -->
                <div class="bg-white border-2 border-primary-400 rounded-xl p-4 shadow-sm relative group overflow-hidden">
                    <div class="flex justify-between items-start mb-4 relative z-10">
                        <div class="w-10 h-10 rounded-full bg-primary-100 text-primary-700 flex items-center justify-center font-bold text-lg">01</div>
                        <span class="text-[10px] font-bold uppercase bg-primary-600 text-white px-2 py-0.5 rounded tracking-wide">Terisi</span>
                    </div>
                    
                    <div class="relative z-10 space-y-2">
                        <p class="text-xs text-slate-500">Kapasitas: 4 Orang</p>
                        <p class="text-xs text-slate-500">Status: <span class="font-medium text-slate-700">1 Pesanan Aktif</span></p>
                    </div>

                    <div class="mt-4 pt-4 border-t border-slate-100 flex gap-2 relative z-10">
                        <button class="flex-1 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-xs font-medium flex justify-center items-center gap-1 transition-colors cursor-pointer" title="Cetak QR Code">
                            <i data-lucide="qr-code" class="w-3.5 h-3.5"></i> QR
                        </button>
                        <button class="flex-1 py-1.5 bg-white border border-slate-200 hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 text-slate-600 rounded text-xs font-medium flex justify-center items-center transition-colors cursor-pointer" title="Tutup Meja & Kosongkan">
                            Tutup Meja
                        </button>
                    </div>
                </div>

                <!-- Table 2 (Empty) -->
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm relative group">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center font-bold text-lg">02</div>
                        <span class="text-[10px] font-bold uppercase bg-slate-100 text-slate-500 px-2 py-0.5 rounded tracking-wide">Kosong</span>
                    </div>
                    
                    <div class="space-y-2">
                        <p class="text-xs text-slate-500">Kapasitas: 2 Orang</p>
                        <p class="text-xs text-slate-500 text-transparent select-none">-</p>
                    </div>

                    <div class="mt-4 pt-4 border-t border-slate-100 flex gap-2">
                        <button class="flex-1 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-xs font-medium flex justify-center items-center gap-1 transition-colors cursor-pointer" title="Cetak QR Code">
                            <i data-lucide="qr-code" class="w-3.5 h-3.5"></i> Lihat QR
                        </button>
                        <!-- Delete button hidden by default, visible on hover -->
                        <button class="w-8 shrink-0 py-1.5 bg-white border border-slate-200 hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 text-slate-400 rounded flex justify-center items-center transition-colors opacity-0 group-hover:opacity-100 cursor-pointer text-xs" title="Hapus Meja">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>

                <!-- Table 3 (Empty) -->
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm relative group">
                    <div class="flex justify-between items-start mb-4">
                        <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center font-bold text-lg">03</div>
                        <span class="text-[10px] font-bold uppercase bg-slate-100 text-slate-500 px-2 py-0.5 rounded tracking-wide">Kosong</span>
                    </div>
                    
                    <div class="space-y-2">
                        <p class="text-xs text-slate-500">Kapasitas: 4 Orang</p>
                        <p class="text-xs text-slate-500 text-transparent select-none">-</p>
                    </div>

                    <div class="mt-4 pt-4 border-t border-slate-100 flex gap-2">
                        <button class="flex-1 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded text-xs font-medium flex justify-center items-center gap-1 transition-colors cursor-pointer" title="Cetak QR Code">
                            <i data-lucide="qr-code" class="w-3.5 h-3.5"></i> Lihat QR
                        </button>
                        <!-- Delete button hidden by default, visible on hover -->
                        <button class="w-8 shrink-0 py-1.5 bg-white border border-slate-200 hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200 text-slate-400 rounded flex justify-center items-center transition-colors opacity-0 group-hover:opacity-100 cursor-pointer text-xs" title="Hapus Meja">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
